<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="coffeeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <linearGradient id="coffeeLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#2D1B18"/>
      <stop offset="100%" stop-color="#1A0F0D"/>
    </linearGradient>
    <linearGradient id="crema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <filter id="cupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B4D3E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#coffeeBg)"/>

  <!-- Vintage Kopitiam Floral Saucer -->
  <g filter="url(#cupShadow)">
    <ellipse cx="300" cy="340" rx="190" ry="50" fill="#D5C5B0" opacity="0.4"/>
    <ellipse cx="300" cy="335" rx="180" ry="45" fill="#FAF8F5"/>
    <ellipse cx="300" cy="335" rx="172" ry="41" fill="#FFFFFF" stroke="#1B4D3E" stroke-width="2.5"/>
    <!-- Traditional green floral crest on saucer rim -->
    <path d="M140 335 Q145 328 155 335 Q145 342 140 335 Z" fill="#1B4D3E"/>
    <path d="M460 335 Q455 328 445 335 Q455 342 460 335 Z" fill="#1B4D3E"/>
    <path d="M300 370 Q292 373 300 376 Q308 373 300 370 Z" fill="#1B4D3E"/>
    <ellipse cx="300" cy="335" rx="110" ry="25" fill="#E8DEC8" opacity="0.5"/>
  </g>

  <!-- Cup Handle -->
  <path d="M375 220 C445 220, 445 300, 375 300" fill="none" stroke="#FAF8F5" stroke-width="22" stroke-linecap="round" filter="url(#cupShadow)"/>
  <path d="M375 220 C445 220, 445 300, 375 300" fill="none" stroke="#E2D7C3" stroke-width="6" stroke-linecap="round"/>

  <!-- Thick Ceramic Kopitiam Cup -->
  <g filter="url(#cupShadow)">
    <!-- Cup Body -->
    <path d="M205 190 C210 310, 230 330, 300 330 C370 330, 390 310, 395 190 Z" fill="#FAF8F5"/>
    <path d="M210 195 C215 305, 235 325, 300 325 C365 325, 385 305, 390 195 Z" fill="#FFFFFF"/>

    <!-- Green Floral Pattern on Cup (Traditional Kopitiam Motif) -->
    <g transform="translate(300, 260) scale(0.9)">
      <path d="M0 -25 C-12 -12, -25 0, 0 25 C25 0, 12 -12, 0 -25 Z" fill="#1B4D3E" opacity="0.85"/>
      <circle cx="-15" cy="-2" r="6" fill="#1B4D3E" opacity="0.85"/>
      <circle cx="15" cy="-2" r="6" fill="#1B4D3E" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#D99B26"/>
    </g>

    <!-- Cup Rim & Coffee Surface -->
    <ellipse cx="300" cy="190" rx="95" ry="32" fill="#FAF8F5" stroke="#E5DEC9" stroke-width="3"/>
    <ellipse cx="300" cy="190" rx="88" ry="27" fill="url(#coffeeLiquid)"/>

    <!-- Crema & Swirl -->
    <ellipse cx="300" cy="190" rx="82" ry="23" fill="url(#crema)" opacity="0.85"/>
    <path d="M245 190 Q300 175 350 190 Q310 205 255 192" fill="none" stroke="#A1887F" stroke-width="4" opacity="0.6"/>
    <circle cx="285" cy="185" r="3" fill="#D7CCC8" opacity="0.5"/>
    <circle cx="320" cy="193" r="2.5" fill="#D7CCC8" opacity="0.5"/>
  </g>

  <!-- Aromatic Steam Rising -->
  <g stroke="#D99B26" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M270 150 Q260 120 280 95 Q295 70 285 45"/>
    <path d="M305 145 Q325 115 310 90 Q295 65 315 40"/>
    <path d="M340 150 Q350 125 335 100 Q325 80 338 55"/>
  </g>

  <!-- Roasted Coffee Beans near saucer -->
  <g transform="translate(185, 345) rotate(-20)">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#4E342E"/>
    <path d="M-8 0 Q0 -3 8 0" stroke="#2D1B18" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(205, 360) rotate(35)">
    <ellipse cx="0" cy="0" rx="11" ry="7.5" fill="#5D4037"/>
    <path d="M-7 0 Q0 3 7 0" stroke="#3E2723" stroke-width="2.2" fill="none"/>
  </g>

  <!-- Badge -->
  <rect x="25" y="25" width="165" height="34" rx="17" fill="#1B4D3E"/>
  <text x="107" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FAF8F5" letter-spacing="1">
    ☕ KOPI KOPITIAM
  </text>
</svg>