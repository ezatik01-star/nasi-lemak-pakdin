<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="icedBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <linearGradient id="icedTeaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E57373"/>
      <stop offset="25%" stop-color="#C25E00"/>
      <stop offset="70%" stop-color="#8B3D06"/>
      <stop offset="100%" stop-color="#5D2600"/>
    </linearGradient>
    <filter id="iceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B4D3E" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#icedBg)"/>

  <!-- Coaster -->
  <ellipse cx="300" cy="380" rx="130" ry="24" fill="#D5C5B0" opacity="0.4" filter="url(#iceShadow)"/>
  <ellipse cx="300" cy="378" rx="115" ry="18" fill="#1B4D3E" opacity="0.8"/>
  <ellipse cx="300" cy="376" rx="108" ry="15" fill="#D99B26"/>

  <!-- Glass & Drink -->
  <g filter="url(#iceShadow)">
    <!-- Liquid Tea -->
    <path d="M228 140 L242 355 C242 368, 358 368, 358 355 L372 140 Z" fill="url(#icedTeaGrad)"/>

    <!-- Clear Ice Cubes -->
    <g fill="#FFFFFF" opacity="0.4">
      <rect x="250" y="170" width="46" height="46" rx="9" transform="rotate(18 250 170)"/>
      <rect x="300" y="210" width="48" height="48" rx="10" transform="rotate(-15 300 210)"/>
      <rect x="255" y="260" width="50" height="50" rx="10" transform="rotate(25 255 260)"/>
      <rect x="295" y="300" width="45" height="45" rx="8" transform="rotate(-10 295 300)"/>
    </g>
    <!-- Ice highlights -->
    <path d="M260 185 L285 178 M310 220 L335 228" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Lemon Slice on Rim -->
    <g transform="translate(365, 130) rotate(40)">
      <circle cx="0" cy="0" r="32" fill="#FBC02D"/>
      <circle cx="0" cy="0" r="27" fill="#FFF59D"/>
      <!-- Lemon segments -->
      <path d="M0 -22 L0 22 M-22 0 L22 0 M-15 -15 L15 15 M-15 15 L15 -15" stroke="#F57F17" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#FFFDE7"/>
    </g>

    <!-- Mint Leaves on Top -->
    <path d="M245 130 C240 105, 275 110, 270 135 C265 140, 250 140, 245 130 Z" fill="#4CAF50"/>
    <path d="M270 130 C280 110, 310 115, 295 138 C285 142, 272 138, 270 130 Z" fill="#66BB6A"/>

    <!-- Glass Contour & Highlights -->
    <path d="M220 120 L238 360 C240 375, 360 375, 362 360 L380 120 C380 108, 220 108, 220 120 Z" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.75"/>
    <ellipse cx="300" cy="116" rx="80" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
    <!-- Condensation Water Drops on Glass -->
    <ellipse cx="236" cy="220" rx="3" ry="5" fill="#FFFFFF" opacity="0.6"/>
    <ellipse cx="239" cy="270" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.5"/>
    <ellipse cx="362" cy="240" rx="3.5" ry="6" fill="#FFFFFF" opacity="0.6"/>
    <ellipse cx="359" cy="290" rx="2.5" ry="4.5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Green Straw -->
  <path d="M275 70 L285 30 L275 25 L260 70" fill="#1B4D3E"/>
  <path d="M275 70 L290 220" stroke="#1B4D3E" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

  <!-- Badge -->
  <rect x="25" y="25" width="160" height="34" rx="17" fill="#1B4D3E"/>
  <text x="105" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FAF8F5" letter-spacing="1">
    ❄ SEGAR & DINGIN
  </text>
</svg>